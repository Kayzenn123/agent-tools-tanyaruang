<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="TanyaRuang — Pilih tiketmu, berangkat belajar.">
  <rect width="1200" height="630" fill="#EDF6E9"/>
  <!-- pola lubang karcis di tepi atas dan bawah -->
  <g fill="#EDF6E9" stroke="#1E3A24" stroke-width="2">
    <circle cx="60" cy="0" r="14"/><circle cx="180" cy="0" r="14"/><circle cx="300" cy="0" r="14"/><circle cx="420" cy="0" r="14"/><circle cx="540" cy="0" r="14"/><circle cx="660" cy="0" r="14"/><circle cx="780" cy="0" r="14"/><circle cx="900" cy="0" r="14"/><circle cx="1020" cy="0" r="14"/><circle cx="1140" cy="0" r="14"/>
    <circle cx="60" cy="630" r="14"/><circle cx="180" cy="630" r="14"/><circle cx="300" cy="630" r="14"/><circle cx="420" cy="630" r="14"/><circle cx="540" cy="630" r="14"/><circle cx="660" cy="630" r="14"/><circle cx="780" cy="630" r="14"/><circle cx="900" cy="630" r="14"/><circle cx="1020" cy="630" r="14"/><circle cx="1140" cy="630" r="14"/>
  </g>

  <!-- stempel kecil -->
  <g transform="rotate(-8 1010 110)">
    <rect x="920" y="80" width="180" height="56" rx="8" fill="none" stroke="#E63946" stroke-width="5"/>
    <text x="1010" y="117" font-family="monospace" font-size="26" font-weight="bold" fill="#E63946" text-anchor="middle">SAH BERANGKAT</text>
  </g>

  <text x="600" y="200" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="900" fill="#1E3A24" text-anchor="middle" letter-spacing="4">TANYARUANG</text>
  <text x="600" y="258" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1E3A24" text-anchor="middle">Pilih tiketmu, berangkat belajar.</text>

  <!-- 4 tiket kecil -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" text-anchor="middle">
    <g transform="rotate(-3 210 420)">
      <rect x="90" y="350" width="240" height="140" rx="12" fill="#FFFFFF" stroke="#1E3A24" stroke-width="4"/>
      <line x1="90" y1="420" x2="330" y2="420" stroke="#1E3A24" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="210" y="400" fill="#1E3A24">MATEMATIKA</text>
      <text x="210" y="465" fill="#0E9F7A" font-size="22">Pecahan &amp; Persen</text>
    </g>
    <g transform="rotate(2 480 420)">
      <rect x="360" y="350" width="240" height="140" rx="12" fill="#FFFFFF" stroke="#1E3A24" stroke-width="4"/>
      <line x1="360" y1="420" x2="600" y2="420" stroke="#1E3A24" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="480" y="400" fill="#1E3A24">IPA</text>
      <text x="480" y="465" fill="#0E9F7A" font-size="22">Gaya &amp; Gerak</text>
    </g>
    <g transform="rotate(-2 750 420)">
      <rect x="630" y="350" width="240" height="140" rx="12" fill="#FFFFFF" stroke="#1E3A24" stroke-width="4"/>
      <line x1="630" y1="420" x2="870" y2="420" stroke="#1E3A24" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="750" y="400" fill="#1E3A24">B. INDONESIA</text>
      <text x="750" y="465" fill="#0E9F7A" font-size="22">Teks Eksposisi</text>
    </g>
    <g transform="rotate(3 1020 420)">
      <rect x="900" y="350" width="240" height="140" rx="12" fill="#FFFFFF" stroke="#1E3A24" stroke-width="4"/>
      <line x1="900" y1="420" x2="1140" y2="420" stroke="#1E3A24" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="1020" y="400" fill="#1E3A24">IPS</text>
      <text x="1020" y="465" fill="#0E9F7A" font-size="22">Interaksi Sosial</text>
    </g>
  </g>

  <text x="600" y="570" font-family="monospace" font-size="24" font-weight="bold" fill="#1E3A24" text-anchor="middle">LOKET GURU • LOKET KUIS • LOKET RINGKASAN</text>
</svg>
